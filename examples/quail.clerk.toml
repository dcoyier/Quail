# Example Clerk deployment (TOML-only allowlist). Replace clerk_domain and
# clerk_user_id with values from your Clerk instance. Restart after edits.
#
#   uv run quail process --config /absolute/path/to/examples/quail.clerk.toml
#   uv run quail run --config /absolute/path/to/examples/quail.clerk.toml


[core]
database = "data/clerk-quail.turso"
feedback = "data/clerk-feedback.jsonl"

[auth]
mode = "clerk"
clerk_domain = "your-instance.clerk.accounts.dev"
# Clerk application party id(s) allowed to present JWTs (azp and/or aud).
# Find the application id in the Clerk dashboard (OAuth / application settings).
clerk_authorized_parties = ["your_clerk_application_id"]

[hosting]
bind = "127.0.0.1"
port = 8000
# Public origin clients use to reach this MCP (ngrok/HTTPS URL in production).
# Defaults to http://{bind}:{port}. Resource metadata uses {public_base_url}/mcp.
# public_base_url = "https://your-tunnel.example"
# max_concurrent_executions = 2

# Clerk operator notes (identity mode):
# 1. Create a Clerk application and enable Dynamic client registration
#    (Dashboard → OAuth applications).
# 2. Put this app's party id in auth.clerk_authorized_parties (JWT azp/aud).
# 3. Set default OAuth scopes to include openid, profile, email (client UX;
#    Quail does not enforce token scopes — allowlist + party binding do).
# 4. Invite users in Clerk; copy each user_… id into [[users]] below.
# 5. Point MCP clients at {public_base_url}/mcp (or http://127.0.0.1:8000/mcp locally).
# 6. Restart quail run after TOML edits. Sessions are owned by the creating user.

[[workspaces]]
id = "acme"

[[workspaces.datasets]]
id = "notes"
source = "data/notes.csv"
name = "Notes"

[[workspaces]]
id = "labs"

[[workspaces.datasets]]
id = "other"
source = "data/notes.csv"
name = "Other copy"

[[users]]
id = "alice"
clerk_user_id = "user_replace_me"
workspaces = ["acme", "labs"]
default_workspace = "acme"
# lock_workspace = true
