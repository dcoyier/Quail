[core]
database = "data/quail.turso"
search_database = "data/quail-search.turso"
feedback = "data/feedback.jsonl"

[auth]
mode = "unrestricted"
workspace = "menus"

[hosting]
bind = "127.0.0.1"
port = 8000

[[datasets]]
id = "nypl_items"
source = "data/nypl_items.csv"
name = "NYPL menu dish lines (1850s-2000s)"

[[datasets]]
id = "nypl_menu_docs"
source = "data/nypl_menu_docs.csv"
name = "NYPL menus as documents (1850s-2000s)"

