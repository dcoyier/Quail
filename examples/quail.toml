[core]
database = "data/quail.turso"
feedback = "data/feedback.jsonl"
# Optional search DB for Lexical FTS + Semantic vectors (must differ from database):
# search_database = "data/quail-search.turso"

[auth]
mode = "unrestricted"
workspace = "local"

[hosting]
bind = "127.0.0.1"
port = 8000
# Optional process-wide quail_exec slot ceiling (default 2, range 1–100):
# max_concurrent_executions = 2
# Dangerous: allow unrestricted MCP on a non-loopback bind / public_base_url:
# allow_public_unrestricted = true

# Optional warm knobs for `quail process` (defaults: batch 32, concurrency 2):
# [search.warm]
# embed_batch_size = 32
# max_concurrent_embed_requests = 2

# Optional embedding providers when any dataset declares [datasets.embedding]:
# [providers.ollama]
# base_url = "http://127.0.0.1:11434"
#
# [providers.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# api_key = "env:QUAIL_OPENROUTER_API_KEY"

[[datasets]]
id = "notes"
source = "data/notes.csv"
name = "Notes"

# Optional per-dataset embedding profile (pinned on apply; warmed by quail process):
# [datasets.embedding]
# provider = "ollama"
# model = "embeddinggemma:latest"
# dimensions = 768
# revision = "embeddinggemma-local-v1"
# Optional: only embed these CSV columns (Lexical still uses all fields):
# fields = ["content"]
