# Unrestricted soak deploy: sample notes corpus.
# Lexical indexes title+body; Semantic embeds body only when embedding is set.
#
#   uv run quail process --config /absolute/path/to/examples/quail.soak.toml
#   uv run quail run --config /absolute/path/to/examples/quail.soak.toml
#
# Optional: pin the example notes connector after
# `uv pip install -e ./examples/notes-connector`.

[core]
database = "data/soak-quail.turso"
feedback = "data/soak-feedback.jsonl"
search_database = "data/soak-quail-search.turso"

[auth]
mode = "unrestricted"
workspace = "local"

[hosting]
bind = "127.0.0.1"
port = 8000

[providers.ollama]
base_url = "http://127.0.0.1:11434"

[[datasets]]
id = "notes"
source = "data/notes.csv"
name = "Notes"

[datasets.lexical]
fields = ["title", "body"]

[datasets.embedding]
provider = "ollama"
model = "embeddinggemma:latest"
dimensions = 768
revision = "soak-embeddinggemma-v1"
fields = ["body"]
