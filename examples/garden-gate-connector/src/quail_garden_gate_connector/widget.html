<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden Gate dataset card</title>
    <style>
      :root { color-scheme: light dark; font-family: Georgia, "Times New Roman", serif; }
      body { margin: 0; padding: 1rem; background: linear-gradient(160deg, #e8f0e4, #f7f4ee); }
      article { display: grid; gap: 0.5rem; }
      h1, p { margin: 0; }
      h1 { font-size: 1.25rem; color: #1f3d2a; }
      button { justify-self: start; padding: 0.4rem 0.75rem; }
      #status { opacity: 0.7; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <article>
      <h1 id="heading">Garden Gate</h1>
      <p id="dataset">Waiting for a tool result.</p>
      <p id="version"></p>
      <button id="refresh" type="button" disabled>Refresh</button>
      <p id="status" role="status"></p>
    </article>
    <script>
      (() => {
        const protocolVersion = "2026-01-26";
        const pending = new Map();
        const refresh = document.querySelector("#refresh");
        const status = document.querySelector("#status");
        let nextId = 1;
        let selectedDatasetId = null;
        let initialized = false;
        let closed = false;

        function render(value) {
          if (!value || typeof value !== "object") return;
          selectedDatasetId = value?.dataset_id;
          document.querySelector("#heading").textContent = value?.heading ?? "Garden Gate";
          document.querySelector("#dataset").textContent =
            value?.name ?? value?.dataset_id ?? "Unknown";
          document.querySelector("#version").textContent = value?.active_version_id
            ? `Active version: ${value.active_version_id}`
            : "";
          refresh.disabled = closed || !initialized || typeof selectedDatasetId !== "string";
        }

        function send(message) {
          window.parent.postMessage(message, "*");
        }

        function request(method, params, allowBeforeInitialization = false) {
          if (closed) return Promise.reject(new Error("The widget host is closed."));
          if (!allowBeforeInitialization && !initialized) {
            return Promise.reject(new Error("The widget is not initialized."));
          }
          const id = `garden-gate-${nextId++}`;
          return new Promise((resolve, reject) => {
            pending.set(id, { resolve, reject });
            send({ jsonrpc: "2.0", id, method, params });
          });
        }

        function shutdown(error) {
          if (closed) return;
          closed = true;
          initialized = false;
          refresh.disabled = true;
          for (const waiter of pending.values()) waiter.reject(error);
          pending.clear();
          window.removeEventListener("message", receive);
        }

        function validInitializeResult(result) {
          return Boolean(
            result
            && typeof result === "object"
            && result.protocolVersion === protocolVersion
            && result.hostCapabilities
            && typeof result.hostCapabilities === "object"
            && result.hostInfo
            && typeof result.hostInfo === "object"
            && typeof result.hostInfo.name === "string"
            && typeof result.hostInfo.version === "string"
          );
        }

        function receive(event) {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.method === "ui/resource-teardown") {
            if (Object.prototype.hasOwnProperty.call(message, "id")) {
              send({ jsonrpc: "2.0", id: message.id, result: {} });
            }
            shutdown(new Error("The widget host disconnected."));
            status.textContent = "Closed.";
            return;
          }
          if (!message.method && Object.prototype.hasOwnProperty.call(message, "id")) {
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) {
              waiter.reject(new Error(message.error.message ?? "Host request failed"));
            } else {
              waiter.resolve(message.result);
            }
            return;
          }
          if (
            message.method === "ping"
            && Object.prototype.hasOwnProperty.call(message, "id")
          ) {
            send({ jsonrpc: "2.0", id: message.id, result: {} });
            return;
          }
          if (!initialized) return;
          if (message.method === "ui/notifications/tool-result") {
            if (message.params?.isError) status.textContent = "Tool call failed.";
            else render(message.params?.structuredContent);
            return;
          }
        }

        window.addEventListener("message", receive, { passive: true });

        refresh.addEventListener("click", async () => {
          if (!initialized || closed || typeof selectedDatasetId !== "string") return;
          status.textContent = "Refreshing…";
          try {
            const result = await request("tools/call", {
              name: "garden_gate_describe_dataset",
              arguments: { dataset_id: selectedDatasetId },
            });
            if (result?.isError) status.textContent = "Refresh failed.";
            else {
              render(result?.structuredContent);
              status.textContent = "Updated.";
            }
          } catch (_error) {
            status.textContent = closed ? "Closed." : "Refresh failed.";
          }
        });

        (async () => {
          try {
            const result = await request("ui/initialize", {
              protocolVersion,
              appInfo: { name: "quail-garden-gate-dataset-card", version: "1.0.0" },
              appCapabilities: {},
            }, true);
            if (!validInitializeResult(result)) throw new Error("Invalid initialize result");
            if (closed) return;
            send({
              jsonrpc: "2.0",
              method: "ui/notifications/initialized",
              params: {},
            });
            initialized = true;
          } catch (error) {
            if (closed) return;
            shutdown(error);
            status.textContent = "Initialization failed.";
          }
        })();
      })();
    </script>
  </body>
</html>
