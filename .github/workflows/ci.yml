name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --group dev

      - name: Install example connector
        run: uv pip install -e ./examples/notes-connector

      - name: Ruff
        run: uv run ruff check quail tests

      - name: Mypy
        run: uv run mypy quail

      - name: Pytest
        run: uv run pytest -q

      - name: Wheel install smoke
        run: |
          uv build
          uv venv /tmp/quail-smoke
          uv pip install --python /tmp/quail-smoke dist/*.whl
          /tmp/quail-smoke/bin/python -c "import quail; assert quail.__version__ == '0.11.0a0'"
