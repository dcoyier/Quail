[project]
name = "quail"
version = "0.94.0a0"
description = "An environment for agentic qualitative analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Dashiell Coyier" }]
dependencies = ["google-re2>=1.1", "numpy>=2,<3"]

[project.scripts]
quail = "quail.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail"]

# Keep one canonical manual; include its exact text in installed distributions.
[tool.hatch.build.targets.wheel.force-include]
"USING_QUAIL.md" = "quail/data/USING_QUAIL.md"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "mypy>=1.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["quail"]

[[tool.mypy.overrides]]
module = "re2"
# The native package supplies no stubs; its use is isolated in language values.
ignore_missing_imports = true
