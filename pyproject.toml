[project]
name = "quail"
version = "0.11.0a0"
description = "Inspectable qualitative analysis over corpora"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Dashiell Coyier" }]
dependencies = [
  "mcp==1.28.1",
  "pyjwt[crypto]==2.13.0",
  "pyturso==0.7.0",
]

[project.scripts]
quail = "quail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
  "mypy>=1.16,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
