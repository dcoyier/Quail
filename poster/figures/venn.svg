    text { font-variant-ligatures: none; }
  </style>
  <text class="t" x="440" y="36">keyword: <tspan style="font-family:'JetBrains Mono',monospace;font-weight:600">"parking"</tspan></text>
  <text class="t" x="856" y="36">meaning: <tspan style="font-weight:500;font-style:italic">no place to park&#8230;</tspan></text>

  <circle cx="520" cy="246" r="186" fill="#3B6EA8" fill-opacity="0.12" stroke="#3B6EA8" stroke-width="4"/>
  <circle cx="776" cy="246" r="186" fill="#7A5BC7" fill-opacity="0.12" stroke="#7A5BC7" stroke-width="4"/>

  <text class="id" x="414" y="178">r01</text>
  <text class="id" x="414" y="220">r14</text>
  <text class="id bad" x="414" y="276">r04</text>
  <text class="id bad" x="414" y="318">r13</text>

  <text class="id" x="648" y="190">r07</text>
  <text class="id" x="648" y="234">r21</text>
  <text class="id" x="648" y="278">r24</text>
  <text class="id" x="648" y="322">r28</text>

