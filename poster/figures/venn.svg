  <text class="id" x="882" y="314">r17</text>

  <g text-anchor="end">
    <text class="s" x="296" y="210" style="fill:#C9453A;font-weight:600">false positives</text>
    <text class="q" x="296" y="244">&#8220;a parking lot</text>
    <text class="q" x="296" y="272">of ideas&#8221;</text>
    <text class="q" x="296" y="310">&#8220;put it in the</text>
    <text class="q" x="296" y="338">parking lot&#8221;</text>
