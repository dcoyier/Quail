<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 436" width="1296" height="436">
  <style>
    text { font-family: Inter, sans-serif; fill: #1F2328; }
    .t { font-size: 25px; font-weight: 700; text-anchor: middle; }
    .s { font-size: 22px; fill: #5B6168; }
    .id { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; text-anchor: middle; }
