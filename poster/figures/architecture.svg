<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 504" width="1200" height="504">
  <style>
    text { font-family: 'Source Sans 3', sans-serif; fill: #1C1B19; }
    .h { font-size: 30px; font-weight: 700; }
    .b { font-size: 25px; }
    .s { font-size: 24px; fill: #6F6B64; }
    .cap { font-size: 21px; font-weight: 700; letter-spacing: 2.5px; fill: #6F6B64; }
    .m { font-family: 'Source Code Pro', monospace; font-size: 24px; font-weight: 500; font-variant-ligatures: none; }
    .ln { fill: none; stroke: #1C1B19; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1C1B19"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="280" height="150" rx="18" fill="#EBE7DF"/>
  <text class="h" x="26" y="48" style="font-size:30px">Agent</text>
  <text class="s" x="26" y="88">any harness that can</text>
  <text class="s" x="26" y="120">run shell commands</text>
  <rect x="380" y="0" width="380" height="150" rx="18" fill="#fff" stroke="#1C1B19" stroke-width="3"/>
  <text class="h" x="406" y="48" style="font-size:30px">Session host</text>
  <text class="s" x="406" y="88">starts with the first cell,</text>
  <text class="s" x="406" y="120">then runs one at a time</text>
  <rect x="860" y="0" width="340" height="150" rx="18" fill="#F7E5DA" stroke="#B5522A" stroke-width="3"/>
  <text class="h" x="886" y="48" style="font-size:30px;fill:#B5522A">Session log</text>
  <text class="s" x="886" y="88">code, output and tags,</text>
  <text class="s" x="886" y="120">saved before the reply</text>
  <rect x="0" y="300" width="280" height="200" rx="18" fill="#DFEFE8" stroke="#2A7F63" stroke-width="3"/>
  <text class="h" x="26" y="348" style="font-size:28px;fill:#2A7F63">Embedding model</text>
  <text class="s" x="26" y="388">Ollama or an</text>
  <text class="s" x="26" y="420">OpenAI-compatible</text>
  <text class="s" x="26" y="452">API; may be remote</text>
  <rect x="380" y="300" width="380" height="200" rx="18" fill="#fff" stroke="#1C1B19" stroke-width="3" stroke-dasharray="12 9"/>
  <text class="h" x="406" y="348" style="font-size:30px">Python kernel</text>
  <text class="s" x="406" y="388">keeps variables between cells;</text>
  <text class="s" x="406" y="420">no network, file writes</text>
  <text class="s" x="406" y="452">or subprocesses</text>
  <rect x="860" y="300" width="340" height="200" rx="18" fill="#EBE7DF"/>
  <text class="h" x="886" y="348" style="font-size:30px">Dataset index</text>
  <text class="s" x="886" y="388">one SQLite file: rows,</text>
  <text class="s" x="886" y="420">keyword index, embeddings</text>
  <text class="s" x="886" y="452">and tags; rebuilt from the</text>
  <text class="s" x="886" y="484">study files when needed</text>
  <path class="ln" d="M288,52 L372,52" marker-end="url(#a)"/>
  <text class="s" x="330.0" y="38" text-anchor="middle">cell</text>
  <path class="ln" d="M372,102 L288,102" marker-end="url(#a)"/>
  <text class="s" x="330.0" y="138" text-anchor="middle">reply</text>
  <path class="ln" d="M768,75 L852,75" marker-end="url(#a)"/>
  <text class="s" x="810.0" y="60" text-anchor="middle">first</text>
  <path class="ln" d="M500,158 L500,292" marker-end="url(#a)"/>
  <text class="s" x="488" y="234" text-anchor="end">code</text>
  <path class="ln" d="M600,292 L600,158" marker-end="url(#a)"/>
  <text class="s" x="614" y="222">output,</text>
  <text class="s" x="614" y="250">tag changes</text>
  <path class="ln" d="M404,158 L262,292" marker-end="url(#a)"/>
  <text class="s" x="250" y="214" text-anchor="end">missing</text>
  <text class="s" x="250" y="242" text-anchor="end">embeddings</text>
  <path class="ln" d="M736,158 L878,292" marker-end="url(#a)"/>
  <text class="s" x="880" y="214">then tags and</text>
  <text class="s" x="880" y="242">new embeddings</text>
  <path class="ln" d="M768,400 L852,400" marker-end="url(#a)"/>
  <text class="s" x="810.0" y="386" text-anchor="middle">reads</text>
</svg>
