<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 560" width="1296" height="560">
  <style>
    text { font-family: Inter, sans-serif; fill: #1F2328; }
    .l { font-size: 28px; font-weight: 700; }
    .s { font-size: 23px; fill: #5B6168; }
    .q { font-size: 21px; font-weight: 700; text-anchor: middle; }
    .ln { fill: none; stroke: #1F2328; stroke-width: 3; stroke-linecap: round; }
    .scr { fill: #fff; stroke: #1F2328; stroke-width: 3.5; }
    .qp { fill: #FCEBD3; stroke: #E0912F; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/>
    </marker>
    <g id="mon">
      <rect class="scr" x="0" y="0" width="160" height="104" rx="8"/>
      <path d="M68,104 L64,124 M92,104 L96,124 M50,126 L110,126" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M96,30 A20,20 0 1 0 100,44" fill="none" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
    </g>
  </defs>

  <!-- core -->
  <rect x="298" y="6" width="700" height="130" rx="20" fill="#FFF8EE" stroke="#E0912F" stroke-width="4"/>
  <text class="l" x="648" y="52" text-anchor="middle">One Quail core</text>
  <text class="s" x="648" y="90" text-anchor="middle">language &#183; kernel &#183; session log &#183; study format</text>
  <text class="s" x="648" y="120" text-anchor="middle">in a Python API that adapters wrap</text>
  <path class="ln" d="M470,142 C470,180 300,170 300,200" marker-end="url(#a)"/>
  <path class="ln" d="M826,142 C826,180 996,170 996,200" marker-end="url(#a)"/>

  <!-- local -->
  <text class="l" x="300" y="240" text-anchor="middle">Local CLI</text>
  <text class="s" x="300" y="272" text-anchor="middle">each agent runs its own Quail</text>
  <g transform="translate(10,310)"><use href="#mon"/><rect class="qp" x="36" y="72" width="88" height="28" rx="14"/><text class="q" x="80" y="93">Quail</text></g>
  <g transform="translate(220,310)"><use href="#mon"/><rect class="qp" x="36" y="72" width="88" height="28" rx="14"/><text class="q" x="80" y="93">Quail</text></g>
  <g transform="translate(430,310)"><use href="#mon"/><rect class="qp" x="36" y="72" width="88" height="28" rx="14"/><text class="q" x="80" y="93">Quail</text></g>
  <text class="s" x="300" y="500" text-anchor="middle">the study travels with each agent</text>
  <text class="s" x="300" y="530" text-anchor="middle">through git</text>

  <line x1="648" y1="220" x2="648" y2="540" stroke="#C9CDD2" stroke-width="2.5"/>

  <!-- hosted -->
  <text class="l" x="996" y="240" text-anchor="middle">Hosted wrapper</text>
  <text class="s" x="996" y="272" text-anchor="middle">agents call one Quail server</text>
  <g transform="translate(700,300) scale(0.72)"><use href="#mon"/></g>
  <g transform="translate(937,300) scale(0.72)"><use href="#mon"/></g>
  <g transform="translate(1174,300) scale(0.72)"><use href="#mon"/></g>
  <path class="ln" d="M758,396 L930,440" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M995,396 L995,434" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M1232,396 L1060,440" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="890" y="446" width="212" height="84" rx="14" fill="#fff" stroke="#1F2328" stroke-width="3.5"/>
  <rect class="qp" x="926" y="466" width="140" height="44" rx="22"/>
  <text x="996" y="496" text-anchor="middle" style="font-size:24px;font-weight:700">Quail</text>
  <text class="s" x="1120" y="484">auth, MCP,</text>
  <text class="s" x="1120" y="512">containers</text>
</svg>
