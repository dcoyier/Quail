<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 210" width="1296" height="210">
  <style>
    text { font-family: Inter, sans-serif; fill: #1F2328; }
    .l { font-size: 25px; font-weight: 700; text-anchor: middle; }
    .s { font-size: 22px; fill: #5B6168; text-anchor: middle; }
    .m { font-family: 'JetBrains Mono', monospace; font-size: 21px; fill: #5B6168; text-anchor: middle; }
    .bx { fill: #fff; stroke: #1F2328; stroke-width: 3; }
    .ln { fill: none; stroke: #1F2328; stroke-width: 3.5; stroke-linecap: round; }
    text { font-variant-ligatures: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/>
    </marker>
  </defs>
  <path d="M18,4 h268 a14,14 0 0 1 14,14 v130 a14,14 0 0 1 -14,14 h-220 l-30,34 v-34 h-18 a14,14 0 0 1 -14,-14 v-130 a14,14 0 0 1 14,-14 z" fill="#fff" stroke="#1F2328" stroke-width="3"/>
  <text class="l" x="150" y="62">a request</text>
  <text class="s" x="150" y="98">&#8220;@Cursor, start a</text>
  <text class="s" x="150" y="126">Quail session&#8221;</text>

  <line class="ln" x1="308" y1="84" x2="340" y2="84" marker-end="url(#a)"/>
  <rect class="bx" x="352" y="4" width="290" height="158" rx="14"/>
  <text class="l" x="497" y="62">fresh cloud VM</text>
  <text class="s" x="497" y="98">from a snapshot: Quail,</text>
  <text class="s" x="497" y="126">the study, warm vectors</text>

  <line class="ln" x1="650" y1="84" x2="682" y2="84" marker-end="url(#a)"/>
  <rect class="bx" x="694" y="4" width="290" height="158" rx="14" style="fill:#FFF8EE;stroke:#E0912F"/>
  <text class="l" x="839" y="62">agent explores</text>
  <text class="m" x="839" y="100">quail exec &#8230;</text>
  <text class="s" x="839" y="130">one cell at a time</text>

  <line class="ln" x1="992" y1="84" x2="1024" y2="84" marker-end="url(#a)"/>
  <rect class="bx" x="1036" y="4" width="256" height="158" rx="14" style="fill:#D5EEE8;stroke:#2E8B7A"/>
  <text class="l" x="1164" y="62">pushes logs</text>
  <text class="s" x="1164" y="98">to the study repo</text>
  <text class="s" x="1164" y="126">for the next agent</text>
</svg>
