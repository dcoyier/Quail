  <text class="code" x="810.6" y="540" xml:space="preserve">sem</text>
  <text class="code" x="857.2" y="540" xml:space="preserve"> &gt; 0.5</text>
  <text class="s" x="678" y="582">close in meaning</text>
  <path class="predchip" d="M696,606 H1030.8 L1052.8,628 L1030.8,650 H696 L674,628 Z"/>
  <text class="code" x="698" y="636" xml:space="preserve">in_2012 = </text>
  <rect class="fieldmark" x="833" y="614" width="60.8" height="30" rx="4"/>
  <text class="code" x="837" y="636" xml:space="preserve">year</text>
  <text class="code" x="896.8" y="636" xml:space="preserve"> == "2012"</text>
  <text class="s" x="678" y="678">aired in 2012</text>
  <path d="M674,700 H1272" stroke="#CFC9C2" stroke-width="2"/>
  <text class="chain" x="674" y="732">Chain them</text>
  <path class="predchip" d="M696,748 H911.2 L933.2,770 L911.2,792 H696 L674,770 Z"/>
  <text class="code" x="698" y="778" xml:space="preserve">close &amp; ~in_2012</text>
  <text class="s" x="678" y="820">close in meaning, and not from 2012</text>
  <path class="predchip" d="M696,844 H925.2 L947.2,866 L925.2,888 H696 L674,866 Z"/>
  <text class="code" x="698" y="874" xml:space="preserve">close | (</text>
  <rect class="exprmark" x="818.8" y="852" width="36.4" height="30" rx="15"/>
  <text class="code" x="823.8" y="874" xml:space="preserve">kw</text>
  <text class="code" x="857.2" y="874" xml:space="preserve"> &gt; 0)</text>
  <text class="s" x="678" y="916">close in meaning, or says “polls”</text>
  <rect x="0" y="1064" width="1300" height="536" rx="22" fill="#F4F2EF"/>
  <path d="M0,1128 V1086 Q0,1064 22,1064 H1278 Q1300,1064 1300,1086 V1128 Z" fill="#003069"/>
  <rect x="2" y="1066" width="1296" height="532" rx="20" fill="none" stroke="#003069" stroke-width="4"/>
  <text class="lvtitle" x="28" y="1109">Functions</text>
  <text class="lvgloss" x="225" y="1108">the four core operations of the analysis language</text>
  <rect class="card" x="28" y="1156" width="610" height="196" rx="18"/>
  <text class="fname" x="54" y="1210">count</text>
  <text class="idea" x="54" y="1254">Counts the matching entries</text>
  <text class="code" x="54" y="1310" xml:space="preserve">count(</text>
  <path class="predchip" d="M158.2,1283 H218.2 L237.2,1302 L218.2,1321 H158.2 L139.2,1302 Z"/>
  <text class="code" x="155.2" y="1310" xml:space="preserve">close</text>
  <text class="code" x="243.2" y="1310" xml:space="preserve">, by=</text>
  <rect class="fieldchip" x="315.2" y="1283" width="72.8" height="38" rx="6"/>
  <text class="code" x="325.2" y="1310" xml:space="preserve">year</text>
  <text class="code" x="394" y="1310" xml:space="preserve">)</text>
  <rect class="card" x="662" y="1156" width="610" height="196" rx="18"/>
  <text class="fname" x="688" y="1210">retrieve</text>
  <text class="idea" x="688" y="1254">Returns the matching entries to read</text>
  <text class="code" x="688" y="1310" xml:space="preserve">retrieve(</text>
  <path class="predchip" d="M831.8,1283 H891.8 L910.8,1302 L891.8,1321 H831.8 L812.8,1302 Z"/>
  <text class="code" x="828.8" y="1310" xml:space="preserve">close</text>
  <text class="code" x="916.8" y="1310" xml:space="preserve">, rank=</text>
  <rect class="exprchip" x="1015.2" y="1283" width="63.6" height="38" rx="19"/>
  <text class="code" x="1027.2" y="1310" xml:space="preserve">sem</text>
  <text class="code" x="1084.8" y="1310" xml:space="preserve">)</text>
  <rect class="card" x="28" y="1376" width="610" height="196" rx="18"/>
  <text class="fname" x="54" y="1430">values</text>
  <text class="idea" x="54" y="1474">Returns a Python list, one value per entry</text>
  <text class="code" x="54" y="1530" xml:space="preserve">values(</text>
  <rect class="exprchip" x="152.4" y="1503" width="195.6" height="38" rx="19"/>
  <text class="code" x="164.4" y="1530" xml:space="preserve">body.length()</text>
  <text class="code" x="354" y="1530" xml:space="preserve">, where=</text>
  <path class="predchip" d="M484.6,1503 H544.6 L563.6,1522 L544.6,1541 H484.6 L465.6,1522 Z"/>
  <text class="code" x="481.6" y="1530" xml:space="preserve">close</text>
  <text class="code" x="569.6" y="1530" xml:space="preserve">)</text>
  <rect class="card" x="662" y="1376" width="610" height="196" rx="18"/>
  <text class="fname" x="688" y="1430">tag</text>
  <text class="idea" x="688" y="1474">Records a decision on the matching entries</text>
  <text class="code" x="688" y="1530" xml:space="preserve">tag(</text>
  <path class="predchip" d="M765.8,1503 H825.8 L844.8,1522 L825.8,1541 H765.8 L746.8,1522 Z"/>
  <text class="code" x="762.8" y="1530" xml:space="preserve">close</text>
  <text class="code" x="850.8" y="1530" xml:space="preserve">, "topic", "voting lines")</text>
  <path d="M627,198 H673 V252 H706 L650,302 L594,252 H627 Z" fill="#003069"/>
  <path d="M627,948 H673 V1002 H706 L650,1052 L594,1002 H627 Z" fill="#003069"/>
