<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1384 1600" width="1384" height="1600">
  <style>
    text { font-family: 'Source Sans 3', sans-serif; fill: #141414; }
    .s { font-size: 24px; fill: #625D58; }
    .lvtitle { font-size: 34px; font-weight: 700; fill: #fff; }
    .lvgloss { font-size: 26px; fill: #D6E2F0; }
    .coltitle { font-size: 32px; font-weight: 700; }
    .idea { font-size: 27px; font-weight: 600; }
    .chain { font-size: 22px; font-weight: 700; fill: #625D58; }
    .fname { font-family: 'Source Code Pro', monospace; font-size: 36px; font-weight: 700; fill: #003069; font-variant-ligatures: none; }
    .code { font-family: 'Source Code Pro', monospace; font-size: 22px; font-weight: 500; font-variant-ligatures: none; }
    .ln { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: butt; }
    .loop { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: butt; stroke-linejoin: round; }
    .card { fill: #fff; stroke: #141414; stroke-width: 3; }
    .predchip { fill: #D6E2F0; stroke: #003069; stroke-width: 2.5; }
    .exprchip { fill: #fff; stroke: #141414; stroke-width: 2.5; }
    .fieldchip { fill: #E4E2DE; stroke: #141414; stroke-width: 2.5; }
    .tagchip { fill: #FFD24F; stroke: #141414; stroke-width: 2.5; }
    .fieldmark { fill: #E4E2DE; stroke: #141414; stroke-width: 1.5; }
    .exprmark { fill: #fff; stroke: #141414; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="184" rx="22" fill="#F4F2EF"/>
  <path d="M0,64 V22 Q0,0 22,0 H1278 Q1300,0 1300,22 V64 Z" fill="#003069"/>
  <rect x="2" y="2" width="1296" height="180" rx="20" fill="none" stroke="#003069" stroke-width="4"/>
  <text class="lvtitle" x="28" y="45">Fields</text>
  <text class="lvgloss" x="168" y="44">the columns of the dataset</text>
  <rect class="fieldchip" x="28" y="112" width="300" height="48" rx="6"/>
  <text class="code" x="46" y="144" xml:space="preserve">body = Field("body")</text>
  <rect class="fieldchip" x="352" y="112" width="300" height="48" rx="6"/>
  <text class="code" x="370" y="144" xml:space="preserve">year = Field("year")</text>
  <rect class="fieldchip" x="676" y="112" width="247.2" height="48" rx="6"/>
  <text class="code" x="694" y="144" xml:space="preserve">Field("network")</text>
  <rect class="tagchip" x="979.2" y="112" width="220.8" height="48" rx="6"/>
  <text class="code" x="997.2" y="144" xml:space="preserve">Field("topic")</text>
  <text class="s" x="1089.6" y="100" text-anchor="middle">a tag becomes a field</text>
  <rect x="0" y="314" width="1300" height="620" rx="22" fill="#F4F2EF"/>
  <path d="M0,378 V336 Q0,314 22,314 H1278 Q1300,314 1300,336 V378 Z" fill="#003069"/>
  <rect x="2" y="316" width="1296" height="616" rx="20" fill="none" stroke="#003069" stroke-width="4"/>
  <text class="lvtitle" x="28" y="359">Recipes</text>
  <text class="lvgloss" x="187" y="358">kept in variables and reused; nothing runs until a function uses them</text>
  <text class="coltitle" x="28" y="434">Expressions</text>
  <text class="s" x="28" y="468">a value for each entry</text>
  <text class="coltitle" x="674" y="434">Predicates</text>
  <text class="s" x="674" y="468">true or false for each entry, built from expressions</text>
  <rect class="exprchip" x="28" y="510" width="551.6" height="44" rx="22"/>
  <text class="code" x="46" y="540" xml:space="preserve">sem</text>
  <text class="code" x="85.6" y="540" xml:space="preserve"> = </text>
  <rect class="fieldmark" x="128.2" y="518" width="60.8" height="30" rx="4"/>
  <text class="code" x="132.2" y="540" xml:space="preserve">body</text>
  <text class="code" x="192" y="540" xml:space="preserve">.semantic("waiting to vote")</text>
  <text class="s" x="32" y="582">closeness in meaning to a phrase</text>
  <rect class="exprchip" x="28" y="606" width="393.2" height="44" rx="22"/>
  <text class="code" x="46" y="636" xml:space="preserve">kw</text>
  <text class="code" x="72.4" y="636" xml:space="preserve"> = </text>
  <rect class="fieldmark" x="115" y="614" width="60.8" height="30" rx="4"/>
  <text class="code" x="119" y="636" xml:space="preserve">body</text>
  <text class="code" x="178.8" y="636" xml:space="preserve">.lexical("polls")</text>
  <text class="s" x="32" y="678">keyword score; above 0 when the word appears</text>
  <path d="M28,700 H626" stroke="#CFC9C2" stroke-width="2"/>
  <text class="chain" x="28" y="732">Chain them</text>
  <rect class="exprchip" x="28" y="748" width="498.8" height="44" rx="22"/>
  <rect class="fieldmark" x="49" y="756" width="60.8" height="30" rx="4"/>
  <text class="code" x="53" y="778" xml:space="preserve">body</text>
  <text class="code" x="112.8" y="778" xml:space="preserve">.lower().search("long lines?")</text>
  <text class="s" x="32" y="820">methods in a row: the first match, or none</text>
  <rect class="exprchip" x="28" y="844" width="220.8" height="44" rx="22"/>
  <text class="code" x="46" y="874" xml:space="preserve">sem + 0.2 * kw</text>
  <text class="s" x="32" y="916">scores added together</text>
  <path class="predchip" d="M696,510 H938.4 L960.4,532 L938.4,554 H696 L674,532 Z"/>
  <text class="code" x="698" y="540" xml:space="preserve">close = </text>
