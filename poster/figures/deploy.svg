  <text class="h" x="374" y="136" style="font-size:30px">Agent</text>
  <text class="s" x="374" y="174">writes and</text>
  <text class="s" x="374" y="204">reads cells</text>
  <rect x="640" y="88" width="212" height="164" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="666" y="136" style="font-size:30px">Quail</text>
  <text class="s" x="666" y="174">the study&#8217;s</text>
  <text class="s" x="666" y="204">sessions</text>
  <path class="ln" d="M568,150 L632,150" marker-end="url(#a)"/>
  <path class="ln" d="M632,196 L568,196" marker-end="url(#a)"/>
