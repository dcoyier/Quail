<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 196" width="1260" height="196">
  <style>
    text { font-family: Inter, sans-serif; fill: #141414; font-variant-ligatures: none; }
    .l { font-size: 27px; font-weight: 800; }
    .s { font-size: 23px; fill: #6A6A6A; }
    .box { fill: #fff; stroke: #141414; stroke-width: 3.5; }
    .ln { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
  </defs>

  <rect class="box" x="2" y="2" width="270" height="150" rx="20"/>
  <text class="l" x="26" y="48">Slack</text>
  <text class="s" x="26" y="88">a question that</text>
  <text class="s" x="26" y="118">mentions @Cursor</text>

  <path class="ln" d="M282,77 L318,77" marker-end="url(#a)"/>

  <rect class="box" x="330" y="2" width="270" height="150" rx="20"/>
  <text class="l" x="354" y="48">Cloud VM</text>
  <text class="s" x="354" y="88">from a snapshot of</text>
  <text class="s" x="354" y="118">Quail and the study</text>

  <path class="ln" d="M610,77 L646,77" marker-end="url(#a)"/>

  <rect x="658" y="2" width="270" height="150" rx="20" fill="#141414"/>
  <text class="l" x="682" y="48" style="fill:#fff">Agent + Quail</text>
  <text class="s" x="682" y="88" style="fill:#CFCFCF">runs cells in a</text>
  <text class="s" x="682" y="118" style="fill:#CFCFCF">Quail session</text>

  <path class="ln" d="M938,77 L974,77" marker-end="url(#a)"/>

  <rect class="box" x="986" y="2" width="270" height="150" rx="20"/>
  <text class="l" x="1010" y="48">Reply</text>
  <text class="s" x="1010" y="88">with the findings,</text>
  <text class="s" x="1010" y="118">posted in the thread</text>

  <text class="s" x="630" y="188" text-anchor="middle">each thread gets its own VM, agent and Quail session, which last only as long as the task</text>
</svg>
