<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 500" width="1260" height="500">
  <style>
    text { font-family: Inter, sans-serif; fill: #141414; font-variant-ligatures: none; }
    .l { font-size: 27px; font-weight: 800; }
    .s, .s text { font-size: 23px; fill: #6A6A6A; }
    .m, .m text { font-family: 'JetBrains Mono', monospace; font-size: 24px; }
    .ln { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
  </defs>

  <!-- tree -->
  <rect x="2" y="2" width="640" height="496" rx="18" fill="#fff" stroke="#D4D4D4" stroke-width="3"/>
  <g class="m">
    <text x="28" y="50" style="font-weight:800">my-study/</text>
    <text x="28" y="94">&#9500;&#9472; quail.toml</text>
    <text x="28" y="136">&#9500;&#9472; survey.csv</text>
    <text x="28" y="178">&#9500;&#9472; sessions/first-pass/</text>
    <text x="28" y="220">&#9474;  &#9500;&#9472; session.toml</text>
    <text x="28" y="262">&#9474;  &#9492;&#9472; log/*.jsonl</text>
    <text x="28" y="304">&#9500;&#9472; exports/</text>
    <text x="28" y="346">&#9500;&#9472; warm/</text>
    <text x="28" y="388">&#9492;&#9472; .quail/</text>
  </g>
  <g class="s">
    <text x="372" y="94">config</text>
    <text x="372" y="136">source, read-only</text>
    <text x="372" y="262">one per kernel run</text>
    <text x="372" y="304">tags as CSV</text>
    <text x="372" y="346">shared vectors</text>
    <text x="372" y="388">local cache, ignored</text>
  </g>
  <rect x="26" y="420" width="592" height="56" rx="12" fill="#F2F2F1"/>
  <text x="322" y="457" text-anchor="middle" style="font-size:23px;font-weight:600">plain text; Quail itself never runs git</text>

  <!-- remote -->
  <path d="M882,30 v72 a68,18 0 0 0 136,0 v-72" fill="#F2F2F1" stroke="#141414" stroke-width="3"/>
  <ellipse cx="950" cy="30" rx="68" ry="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text x="950" y="88" text-anchor="middle" style="font-size:26px;font-weight:800">git</text>

  <!-- agents -->
  <rect x="680" y="220" width="270" height="160" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="l" x="704" y="262">Agent A</text>
  <rect x="704" y="280" width="222" height="46" rx="23" fill="#F6E4DA" stroke="#B9572B" stroke-width="2.5"/>
  <text x="815" y="311" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;fill:#B9572B">first-pass</text>
  <text class="s" x="704" y="358">first coding pass</text>

  <rect x="986" y="220" width="270" height="160" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="l" x="1010" y="262">Agent B</text>
  <rect x="1010" y="280" width="222" height="46" rx="23" fill="#F6E4DA" stroke="#B9572B" stroke-width="2.5"/>
  <text x="1121" y="311" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;fill:#B9572B">second-pass</text>
  <text class="s" x="1010" y="358">forked, new scheme</text>

  <path class="ln" d="M815,212 C815,160 850,112 872,104" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M1121,212 C1121,160 1050,112 1028,104" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="800" y="160" text-anchor="end">push, pull</text>
  <text class="s" x="1136" y="160">push, pull</text>

  <!-- shards -->
  <text class="l" x="680" y="420">Shared embedding work</text>
  <g style="font-size:23px;font-weight:700">
    <rect x="680" y="440" width="84" height="52" rx="10" fill="#E4E4E2"/>
    <text x="722" y="475" text-anchor="middle">1/4</text>
    <rect x="774" y="440" width="84" height="52" rx="10" fill="#E4E4E2"/>
    <text x="816" y="475" text-anchor="middle">2/4</text>
    <rect x="868" y="440" width="84" height="52" rx="10" fill="#E4E4E2"/>
    <text x="910" y="475" text-anchor="middle">3/4</text>
    <rect x="962" y="440" width="84" height="52" rx="10" fill="#E4E4E2"/>
    <text x="1004" y="475" text-anchor="middle">4/4</text>
  </g>
  <path class="ln" d="M1064,466 L1124,466" marker-end="url(#a)"/>
  <text class="m" x="1140" y="475" style="font-weight:700">warm/</text>
</svg>
