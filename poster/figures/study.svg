  <path d="M116,556 H186 Q196,556 196,566 V618 C171,600 131,638 106,618 V566 Q106,556 116,556 Z" fill="#E3E7EC" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  <text class="b" x="151" y="594" text-anchor="middle" style="font-weight:700">2/4</text>
  <path d="M220,556 H290 Q300,556 300,566 V618 C275,600 235,638 210,618 V566 Q210,556 220,556 Z" fill="#E3E7EC" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  <text class="b" x="255" y="594" text-anchor="middle" style="font-weight:700">3/4</text>
  <path d="M324,556 H394 Q404,556 404,566 V618 C379,600 339,638 314,618 V566 Q314,556 324,556 Z" fill="#E3E7EC" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  <text class="b" x="359" y="594" text-anchor="middle" style="font-weight:700">4/4</text>
  <path class="ln" d="M422,588 L478,588" marker-end="url(#a)"/>
  <text class="m" x="494" y="597" style="font-weight:700">warm/</text>
  <path class="ln" d="M594,588 L650,588" marker-end="url(#a)"/>
  <text class="s" x="666" y="584">every clone&#8217;s first</text>
  <text class="s" x="666" y="612">semantic search is fast</text>
  <text class="s" x="2" y="664">each part can run on a different machine</text>
