<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 600" width="1296" height="600">
  <style>
    text { font-family: Inter, sans-serif; fill: #1F2328; }
    .l { font-size: 26px; font-weight: 700; }
    .s { font-size: 23px; fill: #5B6168; }
    .m { font-family: 'JetBrains Mono', monospace; font-size: 23px; }
    .mc { font-family: 'JetBrains Mono', monospace; font-size: 22px; fill: #8A9096; }
    .ln { fill: none; stroke: #1F2328; stroke-width: 3.5; stroke-linecap: round; }
    text { font-variant-ligatures: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/>
    </marker>
  </defs>

  <!-- tree -->
  <rect x="2" y="2" width="600" height="596" rx="18" fill="#fff" stroke="#C9CDD2" stroke-width="3"/>
  <g class="m">
    <text x="30" y="60" style="font-weight:700">my-study/</text>
    <text x="30" y="112">&#9500;&#9472; quail.toml</text>
    <text x="30" y="164">&#9500;&#9472; survey.csv</text>
    <text x="30" y="216">&#9500;&#9472; sessions/</text>
    <text x="30" y="262">&#9474;  &#9500;&#9472; first-pass/log/</text>
    <text x="30" y="308">&#9474;  &#9492;&#9472; second-pass/log/</text>
    <text x="30" y="360">&#9500;&#9472; exports/</text>
    <text x="30" y="412">&#9500;&#9472; warm/</text>
    <text x="30" y="464">&#9492;&#9472; .quail/</text>
  </g>
  <g class="mc">
    <text x="330" y="112">config</text>
    <text x="330" y="164">source, frozen</text>
    <text x="330" y="216">one JSONL per run</text>
    <text x="330" y="360">CSV of tags</text>
    <text x="330" y="412">shared vectors</text>
    <text x="330" y="464">derived, ignored</text>
  </g>
  <rect x="26" y="500" width="552" height="70" rx="12" fill="#D5EEE8"/>
  <text x="302" y="544" text-anchor="middle" style="font-size:23px;font-weight:600;fill:#2E8B7A">all plain text; Quail never runs git</text>

  <!-- remote -->
  <path d="M905,40 v70 a68,18 0 0 0 136,0 v-70" fill="#F1F2F4" stroke="#1F2328" stroke-width="3"/>
  <ellipse cx="973" cy="40" rx="68" ry="18" fill="#fff" stroke="#1F2328" stroke-width="3"/>
  <text x="973" y="96" text-anchor="middle" style="font-size:24px;font-weight:700">git</text>

  <!-- agents -->
  <rect x="650" y="250" width="290" height="170" rx="18" fill="#fff" stroke="#1F2328" stroke-width="3"/>
  <text class="l" x="676" y="294">Agent A</text>
  <rect x="676" y="316" width="238" height="44" rx="22" fill="#D5EEE8" stroke="#2E8B7A" stroke-width="2.5"/>
  <text x="795" y="346" text-anchor="middle" style="font-size:22px;font-weight:600">first-pass</text>
  <text class="s" x="676" y="398">codes the corpus</text>

  <rect x="1004" y="250" width="290" height="170" rx="18" fill="#fff" stroke="#1F2328" stroke-width="3"/>
  <text class="l" x="1030" y="294">Agent B</text>
  <rect x="1030" y="316" width="238" height="44" rx="22" fill="#D5EEE8" stroke="#2E8B7A" stroke-width="2.5"/>
  <text x="1149" y="346" text-anchor="middle" style="font-size:22px;font-weight:600">second-pass</text>
  <text class="s" x="1030" y="398">forked, new scheme</text>

  <path class="ln" d="M795,242 C795,170 860,120 895,110" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M1149,242 C1149,170 1086,120 1051,110" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="770" y="170" text-anchor="end">push, pull</text>
  <text class="s" x="1176" y="170">push, pull</text>

  <!-- shards -->
  <text class="l" x="650" y="486">Share embedding work</text>
  <g style="font-size:22px;font-weight:600">
    <rect x="650" y="508" width="100" height="56" rx="10" fill="#DCE7F4" stroke="#3B6EA8" stroke-width="2.5"/>
    <text x="700" y="544" text-anchor="middle">1/4</text>
    <rect x="762" y="508" width="100" height="56" rx="10" fill="#DCE7F4" stroke="#3B6EA8" stroke-width="2.5"/>
    <text x="812" y="544" text-anchor="middle">2/4</text>
    <rect x="874" y="508" width="100" height="56" rx="10" fill="#DCE7F4" stroke="#3B6EA8" stroke-width="2.5"/>
    <text x="924" y="544" text-anchor="middle">3/4</text>
    <rect x="986" y="508" width="100" height="56" rx="10" fill="#DCE7F4" stroke="#3B6EA8" stroke-width="2.5"/>
    <text x="1036" y="544" text-anchor="middle">4/4</text>
  </g>
  <path class="ln" d="M1100,536 L1170,536" marker-end="url(#a)"/>
  <text class="m" x="1186" y="544">warm/</text>
</svg>
