<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1260 576" width="1260" height="576">
  <style>
    text { font-family: Inter, sans-serif; fill: #141414; font-variant-ligatures: none; }
    .l { font-size: 30px; font-weight: 800; }
    .b { font-size: 28px; font-weight: 700; }
    .s { font-size: 25px; fill: #6A6A6A; }
    .ln { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
    <symbol id="pg" viewBox="0 0 40 50">
      <path d="M4,1.5 H27 L38.5,13 V46 a2.5,2.5 0 0 1 -2.5,2.5 H4 a2.5,2.5 0 0 1 -2.5,-2.5 V4 a2.5,2.5 0 0 1 2.5,-2.5 z" fill="#fff" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M27,1.5 V10.5 a2.5,2.5 0 0 0 2.5,2.5 H38.5" fill="#E4E4E2" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="pgt" viewBox="0 0 40 50">
      <path d="M4,1.5 H27 L38.5,13 V46 a2.5,2.5 0 0 1 -2.5,2.5 H4 a2.5,2.5 0 0 1 -2.5,-2.5 V4 a2.5,2.5 0 0 1 2.5,-2.5 z" fill="#F6E4DA" stroke="#B9572B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M27,1.5 V10.5 a2.5,2.5 0 0 0 2.5,2.5 H38.5" fill="#E9C3AE" stroke="#B9572B" stroke-width="3" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- retrieval-augmented generation -->
  <text class="l" x="0" y="32">Retrieval-augmented generation</text>
  <text class="s" x="0" y="68">answers from the passages a search returns</text>
  <use xlink:href="#pg" x="8" y="116" width="72" height="90"/>
  <use xlink:href="#pg" x="22" y="106" width="72" height="90"/>
  <use xlink:href="#pg" x="36" y="96" width="72" height="90"/>
  <text class="s" x="58" y="240" text-anchor="middle">corpus</text>
  <path class="ln" d="M136,152 L216,152" marker-end="url(#a)"/>
  <text class="s" x="176" y="130" text-anchor="middle">search</text>
  <use xlink:href="#pg" x="234" y="125" width="44" height="55"/>
  <use xlink:href="#pg" x="286" y="125" width="44" height="55"/>
  <use xlink:href="#pg" x="338" y="125" width="44" height="55"/>
  <use xlink:href="#pg" x="390" y="125" width="44" height="55"/>
  <use xlink:href="#pg" x="442" y="125" width="44" height="55"/>
  <text class="s" x="360" y="240" text-anchor="middle">top 5 passages</text>
  <path class="ln" d="M506,152 L586,152" marker-end="url(#a)"/>
  <rect x="602" y="107" width="170" height="90" rx="18" fill="#141414"/>
  <text x="687" y="164" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#fff">LLM</text>
  <path class="ln" d="M788,152 L868,152" marker-end="url(#a)"/>
  <rect x="884" y="112" width="230" height="80" rx="40" fill="#fff" stroke="#141414" stroke-width="4"/>
  <text class="b" x="999" y="162" text-anchor="middle">answer</text>

  <line x1="0" y1="250" x2="1260" y2="250" stroke="#D4D4D4" stroke-width="3"/>

  <!-- quail -->
  <text class="l" x="0" y="304">Quail</text>
  <text class="s" x="0" y="340">the agent runs as many cells as it needs, over every entry</text>

  <rect x="0" y="376" width="220" height="92" rx="46" fill="#141414"/>
  <text x="110" y="433" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#fff">Agent</text>
  <path class="ln" d="M110,476 L110,498" marker-end="url(#a)"/>
  <rect x="0" y="508" width="220" height="64" rx="32" fill="#fff" stroke="#141414" stroke-width="4"/>
  <text class="b" x="110" y="550" text-anchor="middle">findings</text>

  <path class="ln" d="M236,394 C300,358 400,358 456,386" marker-end="url(#a)"/>
  <text class="b" x="346" y="412" text-anchor="middle">cell</text>
  <path class="ln" d="M456,454 C400,486 300,486 236,450" marker-end="url(#a)"/>
  <text class="b" x="346" y="458" text-anchor="middle">result</text>

  <rect x="470" y="364" width="500" height="208" rx="22" fill="#F2F2F1" stroke="#141414" stroke-width="4"/>
  <text class="s" x="496" y="404" style="fill:#141414;font-weight:600">kernel over the whole corpus</text>
  <use xlink:href="#pg" x="500" y="424" width="36" height="45"/>
  <use xlink:href="#pgt" x="556" y="424" width="36" height="45"/>
  <use xlink:href="#pg" x="612" y="424" width="36" height="45"/>
  <use xlink:href="#pg" x="668" y="424" width="36" height="45"/>
  <use xlink:href="#pg" x="724" y="424" width="36" height="45"/>
  <use xlink:href="#pgt" x="780" y="424" width="36" height="45"/>
  <use xlink:href="#pg" x="836" y="424" width="36" height="45"/>
  <use xlink:href="#pgt" x="892" y="424" width="36" height="45"/>
  <use xlink:href="#pgt" x="500" y="490" width="36" height="45"/>
  <use xlink:href="#pg" x="556" y="490" width="36" height="45"/>
  <use xlink:href="#pg" x="612" y="490" width="36" height="45"/>
  <use xlink:href="#pgt" x="668" y="490" width="36" height="45"/>
  <use xlink:href="#pg" x="724" y="490" width="36" height="45"/>
  <use xlink:href="#pg" x="780" y="490" width="36" height="45"/>
  <use xlink:href="#pgt" x="836" y="490" width="36" height="45"/>
  <use xlink:href="#pg" x="892" y="490" width="36" height="45"/>

  <path class="ln" d="M986,468 L1046,468" marker-end="url(#a)"/>
  <rect x="1060" y="428" width="196" height="80" rx="40" fill="#F6E4DA" stroke="#B9572B" stroke-width="4"/>
  <text x="1158" y="479" text-anchor="middle" style="font-size:30px;font-weight:800;fill:#B9572B">tags</text>
  <text class="s" x="1158" y="540" text-anchor="middle">saved with</text>
  <text class="s" x="1158" y="570" text-anchor="middle">the study</text>
</svg>
