<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 460" width="1260" height="460">
  <style>
    text { font-family: Inter, sans-serif; fill: #141414; font-variant-ligatures: none; }
    .l { font-size: 28px; font-weight: 800; }
    .s { font-size: 23px; fill: #6A6A6A; }
    .e { font-size: 24px; font-weight: 700; text-anchor: middle; }
    .ev { stroke: #A8A8A8; stroke-width: 3; stroke-dasharray: 8 8; }
    .x { stroke: #141414; stroke-width: 5; stroke-linecap: round; }
    .cell { fill: #fff; stroke: #141414; stroke-width: 3; }
    .bar { font-size: 23px; font-weight: 700; text-anchor: middle; }
  </style>

  <line class="ev" x1="620" y1="24" x2="620" y2="378"/>
  <line class="ev" x1="880" y1="24" x2="880" y2="378"/>
  <line class="ev" x1="1040" y1="24" x2="1040" y2="378"/>
  <text class="e" x="620" y="414">reset</text>
  <text class="e" x="880" y="414">close,</text>
  <text class="e" x="880" y="444">git push</text>
  <text class="e" x="1040" y="414">clone,</text>
  <text class="e" x="1040" y="444">reopen</text>

  <text class="l" x="0" y="72">Cells</text>
  <rect class="cell" x="290" y="46" width="36" height="36" rx="6"/>
  <rect class="cell" x="360" y="46" width="36" height="36" rx="6"/>
  <rect class="cell" x="430" y="46" width="36" height="36" rx="6"/>
  <rect class="cell" x="500" y="46" width="36" height="36" rx="6"/>
  <circle cx="518" cy="64" r="9" fill="#B9572B"/>
  <rect class="cell" x="680" y="46" width="36" height="36" rx="6"/>
  <rect class="cell" x="750" y="46" width="36" height="36" rx="6"/>
  <circle cx="768" cy="64" r="9" fill="#B9572B"/>
  <rect class="cell" x="1100" y="46" width="36" height="36" rx="6"/>
  <rect class="cell" x="1170" y="46" width="36" height="36" rx="6"/>

  <text class="l" x="0" y="158">Source data</text>
  <text class="s" x="0" y="188">read-only</text>
  <rect x="280" y="132" width="978" height="42" rx="21" fill="#E4E4E2"/>
  <text class="bar" x="770" y="161">never modified</text>

  <text class="l" x="0" y="248">Tags</text>
  <text class="s" x="0" y="278">durable</text>
  <line x1="286" y1="244" x2="500" y2="244" stroke="#BDBDBD" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <rect x="500" y="222" width="758" height="42" rx="21" fill="#F6E4DA" stroke="#B9572B" stroke-width="3"/>
  <text class="bar" x="750" y="251" style="fill:#B9572B">kept in the session log</text>

  <text class="l" x="0" y="338">Variables</text>
  <text class="s" x="0" y="368">working memory</text>
  <rect x="290" y="312" width="314" height="42" rx="21" fill="#fff" stroke="#141414" stroke-width="3"/>
  <rect x="636" y="312" width="228" height="42" rx="21" fill="#fff" stroke="#141414" stroke-width="3"/>
  <rect x="1058" y="312" width="200" height="42" rx="21" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="s" x="1158" y="341" text-anchor="middle">new kernel</text>
  <line class="x" x1="608" y1="321" x2="632" y2="345"/><line class="x" x1="632" y1="321" x2="608" y2="345"/>
  <line class="x" x1="868" y1="321" x2="892" y2="345"/><line class="x" x1="892" y1="321" x2="868" y2="345"/>
</svg>
