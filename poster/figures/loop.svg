<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 906" width="1200" height="906">
  <style>
    text { font-family: 'Source Sans 3', sans-serif; fill: #141414; }
    .h { font-size: 30px; font-weight: 700; }
    .b { font-size: 25px; }
    .s { font-size: 24px; fill: #676C73; }
    .cap { font-size: 21px; font-weight: 700; letter-spacing: 2.5px; fill: #676C73; }
    .m { font-family: 'Source Code Pro', monospace; font-size: 24px; font-weight: 500; font-variant-ligatures: none; }
    .ln { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="230" height="300" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="26" y="112" style="font-size:30px">Agent</text>
  <text class="s" x="26" y="150">a language</text>
  <text class="s" x="26" y="180">model with</text>
  <text class="s" x="26" y="210">a shell</text>
  <rect x="970" y="0" width="230" height="300" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="996" y="48">Quail</text>
  <text class="s" x="996" y="82">one session</text>
  <rect x="994" y="104" width="182" height="36" rx="8" fill="#fff" stroke="#D3D8DE" stroke-width="2.5"/>
  <text class="m" x="1006" y="129" style="font-size:19px;fill:#676C73">[9]</text>
  <path d="M1066,122 H1146" fill="none" stroke="#E3E7EC" stroke-width="7" stroke-linecap="round"/>
  <rect x="994" y="148" width="182" height="36" rx="8" fill="#fff" stroke="#D3D8DE" stroke-width="2.5"/>
  <text class="m" x="1006" y="173" style="font-size:19px;fill:#676C73">[10]</text>
  <path d="M1066,166 H1124" fill="none" stroke="#E3E7EC" stroke-width="7" stroke-linecap="round"/>
  <rect x="994" y="192" width="182" height="36" rx="8" fill="#fff" stroke="#D3D8DE" stroke-width="2.5"/>
  <text class="m" x="1006" y="217" style="font-size:19px;fill:#676C73">[11]</text>
  <path d="M1066,210 H1160" fill="none" stroke="#E3E7EC" stroke-width="7" stroke-linecap="round"/>
  <text class="m" x="1006" y="261" style="font-size:19px;fill:#141414">[12]</text>
  <path d="M1066,254 H1136" fill="none" stroke="#3B3F45" stroke-width="7" stroke-linecap="round"/>
  <path class="ln" d="M238,70 L322,70" marker-end="url(#a)"/>
  <rect x="330" y="12" width="540" height="116" rx="14" fill="#fff" stroke="#D3D8DE" stroke-width="3"/>
  <text class="m" x="356" y="60">only = (sem &gt; 0.5) &amp; ~kw</text>
  <text class="m" x="356" y="98">count(only)</text>
  <text class="s" x="846" y="44" text-anchor="end" style="font-size:21px">cell</text>
  <path class="ln" d="M878,70 L962,70" marker-end="url(#a)"/>
  <text class="s" x="600" y="160" text-anchor="middle" style="font-size:23px">kw and sem were defined in earlier cells</text>
  <path class="ln" d="M962,229 L878,229" marker-end="url(#a)"/>
  <rect x="330" y="184" width="540" height="90" rx="14" fill="#fff" stroke="#D3D8DE" stroke-width="3"/>
  <text class="m" x="356" y="238">20</text>
  <text class="s" x="846" y="212" text-anchor="end" style="font-size:21px">output</text>
  <text class="s" x="410" y="238">what a notebook would show</text>
  <path class="ln" d="M322,229 L238,229" marker-end="url(#a)"/>
  <rect x="994" y="236" width="182" height="36" rx="8" fill="none" stroke="#676C73" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 9"/>
  <path d="M994,272 L3,414 M1176,272 L1197,414" fill="none" stroke="#676C73" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 9"/>
  <rect x="0" y="400" width="1200" height="506" rx="24" fill="#F2F4F6"/>
  <rect x="1.5" y="401.5" width="1197" height="503" rx="23" fill="none" stroke="#676C73" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 9"/>
  <rect x="28" y="436" width="250" height="136" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="54" y="484" style="font-size:30px">Embeddings</text>
  <text class="s" x="54" y="522">local (Ollama) or</text>
  <text class="s" x="54" y="552">a hosted API</text>
  <rect x="418" y="436" width="364" height="136" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="444" y="484" style="font-size:30px">Session host</text>
  <text class="s" x="444" y="522">one per session;</text>
  <text class="s" x="444" y="552">runs cells in order</text>
  <path d="M916,436 H1158 Q1172,436 1172,450 V576 C1096,546 978,606 902,576 V450 Q902,436 916,436 Z" fill="#E3E7EC" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  <text class="h" x="928" y="484" style="font-size:30px">Session log</text>
  <text class="s" x="928" y="522">code, output and</text>
  <text class="s" x="928" y="552">tags, written first</text>
  <rect x="398" y="628" width="404" height="250" rx="22" fill="none" stroke="#141414" stroke-width="3" stroke-dasharray="12 9"/>
  <text class="cap" x="422" y="664">SANDBOX</text>
  <rect x="422" y="686" width="356" height="170" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="448" y="734" style="font-size:30px">Python kernel</text>
  <text class="s" x="448" y="772">keeps variables between</text>
  <text class="s" x="448" y="802">cells; no network, file</text>
  <text class="s" x="448" y="832">writes or subprocesses</text>
  <path d="M902,654 V852 A135.0,16 0 0 0 1172,852 V654" fill="#E3E7EC" stroke="#141414" stroke-width="3"/>
  <ellipse cx="1037.0" cy="654" rx="135.0" ry="16" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="928" y="710" style="font-size:30px">Dataset index</text>
  <text class="s" x="928" y="748">one SQLite file:</text>
  <text class="s" x="928" y="778">rows, keyword index,</text>
  <text class="s" x="928" y="808">embeddings and tags</text>
  <path class="ln" d="M286,504 L410,504" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="348" y="462" text-anchor="middle" style="font-size:22px">missing</text>
  <text class="s" x="348" y="488" text-anchor="middle" style="font-size:22px">embeddings</text>
  <path class="ln" d="M790,504 L894,504" marker-end="url(#a)"/>
  <text class="s" x="842" y="488" text-anchor="middle" style="font-size:22px">first</text>
  <path class="ln" d="M560,580 L560,678" marker-end="url(#a)"/>
  <text class="s" x="546" y="610" text-anchor="end" style="font-size:22px">code</text>
  <path class="ln" d="M640,678 L640,580" marker-end="url(#a)"/>
  <text class="s" x="654" y="610" style="font-size:22px">output, tags</text>
  <path class="ln" d="M770,580 L920,636" marker-end="url(#a)"/>
  <text class="s" x="930" y="632" style="font-size:22px">then</text>
  <path class="ln" d="M894,776 L786,776" marker-end="url(#a)"/>
  <text class="s" x="853" y="762" text-anchor="middle" style="font-size:22px">read-only</text>
  <rect x="28" y="648" width="52" height="34" rx="8" fill="#fff" stroke="#141414" stroke-width="2.5"/>
  <text class="s" x="98" y="674">program</text>
  <path d="M34,704 H74 Q80,704 80,710 V732 C66,724 42,744 28,734 V710 Q28,704 34,704 Z" fill="#E3E7EC" stroke="#141414" stroke-width="2.5"/>
  <text class="s" x="98" y="730">file</text>
  <path d="M28,767 V789 A26,7 0 0 0 80,789 V767" fill="#E3E7EC" stroke="#141414" stroke-width="2.5"/>
  <ellipse cx="54" cy="767" rx="26" ry="7" fill="#fff" stroke="#141414" stroke-width="2.5"/>
  <text class="s" x="98" y="786">database</text>
  <rect x="28" y="816" width="52" height="34" rx="8" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="s" x="98" y="842">sandbox</text>
</svg>
