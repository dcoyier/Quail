<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <style>
    text { font-family: 'Source Sans 3', sans-serif; fill: #141414; }
    .h { font-size: 30px; font-weight: 700; }
    .b { font-size: 25px; }
    .s { font-size: 24px; fill: #676C73; }
    .cap { font-size: 21px; font-weight: 700; letter-spacing: 2.5px; fill: #676C73; }
    .m { font-family: 'Source Code Pro', monospace; font-size: 24px; font-weight: 500; font-variant-ligatures: none; }
    .ln { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
  </defs>
  <rect x="280" y="0" width="480" height="110" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="306" y="46" style="font-size:30px">Agent</text>
  <text class="s" x="306" y="84">a language model with a shell</text>
  <text class="s" x="0" y="156" style="font-size:22px">cell</text>
  <rect x="0" y="170" width="420" height="116" rx="14" fill="#fff" stroke="#D3D8DE" stroke-width="3"/>
  <text class="m" x="26" y="218">only = (sem &gt; 0.5) &amp; ~kw</text>
  <text class="m" x="26" y="256">count(only)</text>
  <text class="s" x="0" y="326" style="font-size:23px">kw and sem were defined in earlier cells</text>
  <text class="s" x="640" y="156" style="font-size:22px">output</text>
  <rect x="640" y="170" width="460" height="116" rx="14" fill="#fff" stroke="#D3D8DE" stroke-width="3"/>
  <text class="m" x="666" y="237">20</text>
  <text class="s" x="720" y="237">what a notebook would show</text>
  <rect x="230" y="360" width="970" height="540" rx="24" fill="#F2F4F6"/>
  <text class="cap" x="258" y="404">QUAIL</text>
  <path class="ln" d="M440,118 L440,422" marker-end="url(#a)"/>
  <path class="ln" d="M600,422 L600,118" marker-end="url(#a)"/>
  <rect x="0" y="430" width="200" height="136" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="26" y="478" style="font-size:30px">Embeddings</text>
  <text class="s" x="26" y="516">local (Ollama)</text>
  <text class="s" x="26" y="546">or a hosted API</text>
  <rect x="364" y="430" width="336" height="136" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="390" y="478" style="font-size:30px">Session host</text>
  <text class="s" x="390" y="516">one per session;</text>
  <text class="s" x="390" y="546">runs cells in order</text>
  <path d="M864,430 H1158 Q1172,430 1172,444 V570 C1082,540 940,600 850,570 V444 Q850,430 864,430 Z" fill="#E3E7EC" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  <text class="h" x="876" y="478" style="font-size:30px">Session log</text>
  <text class="s" x="876" y="516">code, output and</text>
  <text class="s" x="876" y="546">tags, written first</text>
  <rect x="342" y="622" width="380" height="250" rx="22" fill="none" stroke="#141414" stroke-width="3" stroke-dasharray="12 9"/>
  <text class="cap" x="520" y="658" text-anchor="middle">SANDBOX</text>
  <rect x="364" y="680" width="336" height="170" rx="18" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="390" y="728" style="font-size:30px">Python kernel</text>
  <text class="s" x="390" y="766">keeps variables between</text>
  <text class="s" x="390" y="796">cells; no network, file</text>
  <text class="s" x="390" y="826">writes or subprocesses</text>
  <path d="M850,648 V846 A161.0,16 0 0 0 1172,846 V648" fill="#E3E7EC" stroke="#141414" stroke-width="3"/>
  <ellipse cx="1011.0" cy="648" rx="161.0" ry="16" fill="#fff" stroke="#141414" stroke-width="3"/>
  <text class="h" x="876" y="704" style="font-size:30px">Dataset index</text>
  <text class="s" x="876" y="742">one SQLite file:</text>
  <text class="s" x="876" y="772">rows, keyword index,</text>
  <text class="s" x="876" y="802">embeddings and tags</text>
  <path class="ln" d="M208,498 L356,498" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="290" y="456" text-anchor="middle" style="font-size:22px">missing</text>
  <text class="s" x="290" y="482" text-anchor="middle" style="font-size:22px">embeddings</text>
  <path class="ln" d="M708,498 L842,498" marker-end="url(#a)"/>
  <text class="s" x="775" y="482" text-anchor="middle" style="font-size:22px">first</text>
  <path class="ln" d="M440,574 L440,672" marker-end="url(#a)"/>
  <text class="s" x="426" y="610" text-anchor="end" style="font-size:22px">code</text>
  <path class="ln" d="M600,672 L600,574" marker-end="url(#a)"/>
  <text class="s" x="614" y="610" style="font-size:22px">output, tags</text>
  <path class="ln" d="M708,530 L872,630" marker-end="url(#a)"/>
  <text class="s" x="884" y="612" style="font-size:22px">then</text>
  <path class="ln" d="M842,770 L708,770" marker-end="url(#a)"/>
  <text class="s" x="782" y="756" text-anchor="middle" style="font-size:22px">read-only</text>
  <rect x="0" y="642" width="52" height="34" rx="8" fill="#fff" stroke="#141414" stroke-width="2.5"/>
  <text class="s" x="70" y="668">program</text>
  <path d="M6,698 H46 Q52,698 52,704 V726 C38,718 14,738 0,728 V704 Q0,698 6,698 Z" fill="#E3E7EC" stroke="#141414" stroke-width="2.5"/>
  <text class="s" x="70" y="724">file</text>
  <path d="M0,761 V783 A26,7 0 0 0 52,783 V761" fill="#E3E7EC" stroke="#141414" stroke-width="2.5"/>
  <ellipse cx="26" cy="761" rx="26" ry="7" fill="#fff" stroke="#141414" stroke-width="2.5"/>
  <text class="s" x="70" y="780">database</text>
  <rect x="0" y="810" width="52" height="34" rx="8" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="s" x="70" y="836">sandbox</text>
</svg>
