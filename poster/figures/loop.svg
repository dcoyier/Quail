<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 430" width="1260" height="430">
  <style>
    text { font-family: Inter, sans-serif; fill: #141414; font-variant-ligatures: none; }
    .t { font-size: 34px; font-weight: 800; }
    .l { font-size: 28px; font-weight: 700; }
    .s { font-size: 25px; fill: #6A6A6A; }
    .m { font-family: 'JetBrains Mono', monospace; font-size: 24px; }
    .ln { fill: none; stroke: #141414; stroke-width: 4; stroke-linecap: round; }
    .nb { fill: #fff; stroke: #141414; stroke-width: 4; }
    .nt { font-size: 25px; font-weight: 800; text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
  </defs>

  <rect x="380" y="4" width="500" height="116" rx="58" fill="#141414"/>
  <text x="630" y="58" text-anchor="middle" style="font-size:36px;font-weight:800;fill:#fff">Agent</text>
  <text x="630" y="94" text-anchor="middle" style="font-size:25px;fill:#CFCFCF">language model and harness</text>

  <path class="ln" d="M500,130 L500,262" marker-end="url(#a)"/>
  <circle class="nb" cx="500" cy="196" r="23"/>
  <text class="nt" x="500" y="205">1</text>
  <text class="l" x="460" y="190" text-anchor="end">a Python cell</text>
  <text class="m" x="460" y="226" text-anchor="end">quail exec S -c CODE</text>

  <path class="ln" d="M760,262 L760,130" marker-end="url(#a)"/>
  <circle class="nb" cx="760" cy="196" r="23"/>
  <text class="nt" x="760" y="205">4</text>
  <text class="l" x="800" y="190">a notebook-style result</text>
  <text class="s" x="800" y="226">output, last value or traceback</text>

  <rect x="150" y="272" width="960" height="150" rx="24" fill="#F2F2F1" stroke="#141414" stroke-width="4"/>
  <circle class="nb" cx="196" cy="320" r="23"/>
  <text class="nt" x="196" y="329">2</text>
  <text class="t" x="234" y="332">Study</text>
  <text class="s" x="344" y="331">the files the agent works in</text>
  <rect x="186" y="352" width="420" height="50" rx="25" fill="#fff" stroke="#BDBDBD" stroke-width="3"/>
  <text x="396" y="386" text-anchor="middle" style="font-size:25px;font-weight:600">source CSVs: read-only</text>
  <rect x="636" y="352" width="330" height="50" rx="25" fill="#F6E4DA" stroke="#B9572B" stroke-width="3"/>
  <text x="801" y="386" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#B9572B">tags: writable</text>
  <circle class="nb" cx="1010" cy="377" r="23"/>
  <text class="nt" x="1010" y="386">3</text>
</svg>
